name: Auto-merge AI Briefs

# Publishes AI Brief posts from the "MarketCentaur trend pulse" scheduled task without a manual merge.
# Early every morning (04:37 IST) it merges each open pull request from a branch named
# trend-brief-YYYY-MM-DD whose date is today or earlier, then runs Build Insights so the page
# is live before the day's social posts (LinkedIn goes out at 10:00 IST).
#
# To stop a brief from going live, add the label "hold" to its pull request (or close it).
# Run it by hand from the Actions tab with "Run workflow" if you want to publish sooner.

on:
  schedule:
    - cron: "7 23 * * *" # 04:37 IST daily
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: auto-merge-ai-briefs
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Merge due AI Brief pull requests
        run: |
          set -euo pipefail
          today="$(TZ=Asia/Kolkata date +%F)"
          merged=0
          gh pr list --repo "$REPO" --state open --base main --limit 100 \
            --json number,headRefName,labels,title,isDraft \
            --jq '.[] | select(.headRefName | startswith("trend-brief-")) | [.number, .headRefName, ([.labels[].name] | join(",")), .isDraft, .title] | @tsv' > prs.tsv
          while IFS=$'\t' read -r num ref labels draft title; do
            date="${ref#trend-brief-}"
            date="${date:0:10}"
            if ! [[ "$date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "#$num ($ref): no date in branch name, skipped"; continue
            fi
            if [[ "$date" > "$today" ]]; then
              echo "#$num ($ref): dated $date, not due yet"; continue
            fi
            if [[ ",$labels," == *",hold,"* ]]; then
              echo "#$num ($ref): has the hold label, skipped"; continue
            fi
            if [[ "$draft" == "true" ]]; then
              echo "#$num ($ref): draft pull request, skipped"; continue
            fi
            if gh pr merge "$num" --repo "$REPO" --squash --delete-branch; then
              echo "#$num merged: $title"
              merged=$((merged + 1))
            else
              echo "#$num could not be merged (conflict or check failure)"
              gh pr comment "$num" --repo "$REPO" --body "Auto-merge failed on $today. Please resolve and merge by hand so the brief goes live." || true
            fi
          done < prs.tsv
          echo "merged=$merged" >> "$GITHUB_ENV"

      - name: Publish the merged briefs now
        if: env.merged != '0'
        run: |
          # Merges made with GITHUB_TOKEN don't trigger push workflows, so start Build Insights directly.
          gh workflow run build-insights.yml --repo "$REPO" --ref main
