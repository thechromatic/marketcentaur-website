name: Build Insights

# Turns Markdown posts in content/insights/ into pages under /insights/ (plus the RSS feed),
# builds practice and industry pages from content/catalog/, renders social
# carousels from content/social/ into assets/social/, then commits the generated files back
# to the same branch so Cloudflare Pages deploys them.
# Runs on every push that touches posts or the build files, and once a day so posts
# dated in the future go live on their date.

on:
  push:
    paths:
      - "content/insights/**"
      - "content/social/**"
      - "content/catalog/**"
      - "assets/marketcentaur-logo-transparent.png"
      - "**.html"
      - "scripts/**"
      - ".github/workflows/build-insights.yml"
  schedule:
    - cron: "30 0 * * *" # 06:00 IST daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-insights-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install build dependencies
        run: npm ci --prefix scripts

      - name: Build Insights pages
        env:
          TZ: Asia/Kolkata
        run: |
          export BUILD_DATE="$(date +%F)"
          node scripts/build-insights.mjs

      - name: Build practice and industry pages from the catalog
        env:
          TZ: Asia/Kolkata
        run: |
          export BUILD_DATE="$(date +%F)"
          node scripts/build-catalog.mjs

      - name: Rebuild use-case pages (links to Insights posts go live on the post's date)
        env:
          TZ: Asia/Kolkata
        run: |
          export BUILD_DATE="$(date +%F)"
          python3 scripts/use-cases/build.py

      - name: Render Open Graph images for new pages
        run: |
          pip install --quiet pillow
          python3 scripts/seo/og-images.py

      - name: Check whether carousels need rendering
        id: social
        run: node scripts/build-social.mjs --check >> "$GITHUB_OUTPUT"

      - name: Install browser for carousel rendering
        if: steps.social.outputs.needed == 'true'
        run: npx --prefix scripts playwright install --with-deps chromium

      - name: Render social carousels
        if: steps.social.outputs.needed == 'true'
        run: node scripts/build-social.mjs

      - name: Commit generated pages
        run: |
          git add insights use-cases use-cases.html sitemap.xml llms.txt assets/social assets/og assets/catalog.json practices industries index.html services.html how-it-works.html industries.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898183+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build Insights and catalog pages"
          git push
